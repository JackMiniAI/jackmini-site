<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archived AI Agent Guide - Jack Mini</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(10, 10, 10, 0.95);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid #222;
  }
  .nav-inner {
    max-width: 960px; margin: 0 auto;
    padding: 18px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .nav-brand { font-size: 15px; font-weight: 600; color: #f0f0f0; }
  .nav-brand span { color: #00D4FF; }
  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a { font-size: 14px; color: #888; text-decoration: none; transition: color 0.15s; }
  .nav-links a:hover, .nav-links a.active { color: #f0f0f0; }
  body {
    font-family: 'Georgia', serif;
    background: #0a0a0a;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .container {
    max-width: 540px;
    width: 100%;
  }
  .badge {
    display: inline-block;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #999;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 4px 10px;
    margin-bottom: 24px;
    letter-spacing: 0.05em;
  }
  h1 {
    font-size: 28px;
    font-weight: normal;
    line-height: 1.3;
    margin-bottom: 16px;
    color: #f0f0f0;
  }
  .sub {
    color: #888;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 36px;
    font-family: -apple-system, sans-serif;
  }
  .form-group {
    margin-bottom: 20px;
  }
  label {
    display: block;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    color: #999;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  input, textarea, select {
    width: 100%;
    background: #111;
    border: 1px solid #333;
    color: #f0f0f0;
    padding: 12px 14px;
    font-size: 15px;
    font-family: -apple-system, sans-serif;
    outline: none;
    transition: border-color 0.2s;
    -webkit-appearance: none;
  }
  input:focus, textarea:focus, select:focus {
    border-color: #666;
  }
  textarea {
    resize: vertical;
    min-height: 100px;
    line-height: 1.5;
  }
  select option { background: #111; }
  button {
    width: 100%;
    background: #f0f0f0;
    color: #0a0a0a;
    border: none;
    padding: 16px;
    font-size: 15px;
    font-family: -apple-system, sans-serif;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  button:hover { background: #d0d0d0; }
  button:disabled { background: #444; color: #777; cursor: not-allowed; }
  .note {
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    color: #555;
    margin-top: 16px;
    text-align: center;
  }
  .success {
    background: #111;
    border: 1px solid #333;
    padding: 32px;
    text-align: center;
    display: none;
  }
  .success h2 { font-size: 22px; font-weight: normal; margin-bottom: 12px; }
  .success p { color: #888; font-family: -apple-system, sans-serif; font-size: 15px; line-height: 1.6; }
  .error-msg {
    color: #e55;
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
  .spots {
    font-family: 'Courier New', monospace;
    font-size: 13px;
    color: #666;
    margin-bottom: 32px;
  }
  .spots span { color: #aaa; }
</style>
</head>
<body>
  <nav>
    <div class="nav-inner">
      <span class="nav-brand">Jack<span>Mini</span></span>
      <ul class="nav-links"><li><a href="/blog/">Blog</a></li><li><a href="/dashboard">Dashboard</a></li></ul>
    </div>
  </nav>
<div class="container">
  <div class="badge">ARCHIVED</div>
  <h1>The AI Agent Operator's Guide is being updated.</h1>
  <p class="sub">The prior edition contains platform-specific material that is no longer current. It is not being distributed while the update is reviewed.</p>
  <div class="spots" style="display:none">Spots remaining: <span id="spots-count">0</span></div>

</div>

</body>
</html>
